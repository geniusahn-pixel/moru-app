name: Deploy PWA to GitHub Pages

# main 브랜치에 코드가 올라가면 자동으로 빌드해서 GitHub Pages에 배포합니다.
# 수동 실행(workflow_dispatch)도 가능합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (GitHub Pages 하위 경로용)
        run: npm run build
        env:
          PAGES: '1'
      - name: Configure Pages (없으면 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          # 저장소 설정을 직접 안 켜도 워크플로가 Pages를 자동 활성화(GitHub Actions 소스)
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
